[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apply-ai"
version = "0.1.0"
description = "AI-powered personal job acquisition agent — maximize interview opportunities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["jobs", "ai", "agent", "resume", "career"]
dependencies = [
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    # Validation & settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # HTTP
    "httpx>=0.27",
    # Config
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Utilities
    "python-dateutil>=2.9",
    "aiofiles>=23.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# AI provider SDKs — both optional; neither required for V1 baseline operation
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]            # google-genai: current Google AI unified SDK
all-providers = ["anthropic>=0.40", "google-genai>=1.0"]

[project.scripts]
applyai = "applyai.cli.main:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["applyai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["applyai"]
omit = ["tests/*", "migrations/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
